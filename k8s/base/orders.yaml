# PROVIDED, and yours to change in Part 3 and 4:
# TODO A: take the shared settings from your ConfigMap (envFrom -> configMapRef).
# TODO B: add DATABASE_URL, built from the PostgreSQL password that lives in your Secret.
#         Hint: an env var that comes from a secretKeyRef can be used in later env values as $(NAME).
#         The URL has the form  postgresql://beanie:<password>@postgres:5432/beanie
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: beanie
  labels: {app: orders}
spec:
  replicas: 2
  selector:
    matchLabels: {app: orders}
  template:
    metadata:
      labels: {app: orders}
    spec:
      containers:
        - name: orders
          image: beanie:0.1.0
          args: ["orders"]
          ports:
            - containerPort: 8002
          env:
            - {name: MENU_URL, value: "http://menu:8001"}
            - {name: PAYMENTS_URL, value: "http://payments:8003"}
            - {name: NOTIFICATIONS_URL, value: "http://notifications:8004"}
          livenessProbe:
            httpGet: {path: /healthz, port: 8002}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: 8002}
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: beanie
spec:
  selector: {app: orders}
  ports:
    - port: 8002
      targetPort: 8002
